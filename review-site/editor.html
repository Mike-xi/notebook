<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>写笔记</title>
  <script>
    (function(){try{var p=localStorage.getItem('nb-theme')||'auto';var d=p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
  </script>
  <link rel="icon" type="image/png" href="/assets/favicon-xi.png?v=20260613c">
  <link rel="stylesheet" href="/assets/style.css?v=20260818b">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
  <link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" disabled>
  <style>
    /* 预览区排版变量（与 viewer-md 一致），随 data-theme 切换 */
    :root {
      --md-bg: var(--surface); --md-fg: var(--on-surface); --md-muted: var(--on-surface-variant);
      --md-border: var(--outline-variant); --md-code-bg: var(--surface-container);
      --md-link: #0969da;
    }
    :root[data-theme="dark"] { --md-link: #79b8ff; }

    body.editor { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }

    /* 顶栏 */
    .ed-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--outline-variant);
      background: var(--surface-container-low);
      flex: none;
    }
    .ed-back {
      width: 38px; height: 38px; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius-full); font-size: 19px;
      color: var(--on-surface);
      transition: background-color var(--transition);
    }
    .ed-back:hover { background: var(--surface-container-high); }
    #ed-title {
      flex: 1; min-width: 0;
      border: none; outline: none; background: transparent;
      color: var(--on-surface);
      font-size: 17px; font-weight: 600; font-family: inherit;
      padding: 8px 6px;
    }
    #ed-subject {
      flex: none; width: 140px;
      border: 1px solid var(--outline-variant); border-radius: var(--radius-full);
      background: var(--surface-container-lowest);
      color: var(--on-surface);
      font-size: 12.5px; font-family: inherit;
      padding: 7px 14px; outline: none;
    }
    #ed-subject:focus { border-color: var(--primary); }
    .ed-status { flex: none; font-size: 12px; color: var(--on-surface-variant); white-space: nowrap; }
    .ed-status.dirty { color: var(--primary); }
    .ed-status.err { color: var(--error); }

    /* Markdown 工具栏：外层只管边框和那颗常驻齿轮，横向滚动交给内层 .ed-tools */
    .ed-toolbar {
      display: flex;
      align-items: stretch;
      padding: 5px 10px;
      border-bottom: 1px solid var(--outline-variant);
      background: var(--surface-container-lowest);
      flex: none;
    }
    .ed-tools {
      flex: 1; min-width: 0;
      display: flex;
      align-items: center;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    .ed-tools::-webkit-scrollbar { height: 0; }
    .ed-tool-cfg {
      flex: none;
      margin-left: 6px;
      padding-left: 12px;
      border-left: 1px solid var(--outline-variant);
      border-radius: 0 8px 8px 0;
      font-size: 15px;
    }
    .ed-tool {
      flex: none;
      min-width: 36px; height: 34px;
      padding: 0 9px;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 8px;
      background: transparent; color: var(--on-surface-variant);
      font-size: 14px; font-family: inherit; cursor: pointer;
      transition: background-color var(--transition), color var(--transition);
    }
    .ed-tool:hover { background: var(--surface-container-high); color: var(--on-surface); }
    .ed-tool:active { background: var(--surface-container-highest); }
    .ed-tool b, .ed-tool i { font-style: normal; }
    .ed-tool i { font-style: italic; }
    .ed-tool-sep { flex: none; width: 1px; align-self: stretch; margin: 6px 5px; background: var(--outline-variant); }

    /* 两个都是窄屏专用：「⋯」展开被顶栏挤掉的学科/字数/状态；桌面是左右分栏，用不上视图切换 */
    .ed-more { display: none; }
    .seg.ed-view { display: none; flex: none; }

    /* ===== 自定义工具栏面板 ===== */
    .ed-cfg {
      position: fixed; inset: 0; z-index: 210;   /* 高于 .dock-menu-detached(130) 与 .modal-overlay(200) */
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .38);
      backdrop-filter: blur(3px);
    }
    .ed-cfg[hidden] { display: none; }
    .ed-cfg-sheet {
      width: min(420px, 100%);
      max-height: min(560px, 86vh);
      display: flex; flex-direction: column;
      border: 1px solid var(--outline-variant); border-radius: 18px;
      background: var(--surface-container-low);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
      overflow: hidden;
    }
    .cfg-head { display: flex; align-items: center; gap: 10px; padding: 15px 16px 9px; }
    .cfg-head h2 { flex: 1; margin: 0; font-size: 15.5px; font-weight: 650; color: var(--on-surface); }
    .cfg-x {
      flex: none; width: 30px; height: 30px;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: var(--radius-full);
      background: transparent; color: var(--on-surface-variant);
      font-size: 14px; cursor: pointer;
    }
    .cfg-x:hover { background: var(--surface-container-high); color: var(--on-surface); }
    .cfg-hint { margin: 0; padding: 0 16px 10px; font-size: 12px; line-height: 1.55; color: var(--on-surface-variant); }
    .cfg-list {
      flex: 1; min-height: 0;
      margin: 0; padding: 0 10px 10px; list-style: none;
      overflow-y: auto; scrollbar-width: thin;
      touch-action: pan-y;
    }
    .cfg-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px 6px 4px;
      border-radius: 10px;
      background: var(--surface-container-low);
    }
    .cfg-item + .cfg-item { margin-top: 2px; }
    .cfg-item.off .cfg-name, .cfg-item.off .cfg-icon { opacity: .42; }
    .cfg-item.dragging {
      background: var(--surface-container-highest);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .22);
      position: relative; z-index: 2;
    }
    .cfg-grip {
      flex: none; width: 26px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent;
      color: var(--on-surface-variant); font-size: 14px;
      cursor: grab; touch-action: none;   /* 不加这条，手机上拖动会被当成页面滚动 */
    }
    .cfg-grip:active { cursor: grabbing; }
    .cfg-icon {
      flex: none; min-width: 30px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--outline-variant); border-radius: 8px;
      background: var(--surface); color: var(--on-surface); font-size: 13px;
    }
    .cfg-icon i { font-style: italic; }
    .cfg-icon b { font-style: normal; }
    .cfg-name { flex: 1; min-width: 0; font-size: 13px; color: var(--on-surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cfg-move {
      flex: none; width: 26px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 7px;
      background: transparent; color: var(--on-surface-variant);
      font-size: 12px; cursor: pointer;
    }
    .cfg-move:hover:not(:disabled) { background: var(--surface-container-high); color: var(--on-surface); }
    .cfg-move:disabled { opacity: .25; cursor: default; }
    /* 显隐开关：小圆点看着像装饰，做成真开关才一眼认得出能点 */
    .cfg-eye {
      flex: none; position: relative;
      width: 36px; height: 21px; margin-left: 4px;
      border: none; border-radius: var(--radius-full);
      background: var(--outline-variant);
      cursor: pointer;
      transition: background-color var(--transition);
    }
    .cfg-eye::after {
      content: ''; position: absolute; top: 2.5px; left: 2.5px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .28);
      transition: transform var(--transition);
    }
    .cfg-item:not(.off) .cfg-eye { background: var(--primary); }
    .cfg-item:not(.off) .cfg-eye::after { transform: translateX(15px); }
    .cfg-foot { display: flex; align-items: center; gap: 10px; padding: 10px 16px 14px; border-top: 1px solid var(--outline-variant); }
    .cfg-foot #cfg-reset { margin-right: auto; }

    /* 编辑 + 预览 双栏 */
    .ed-main { flex: 1; display: flex; min-height: 0; max-width: none; margin: 0; padding: 0; width: 100%; }
    #ed-input {
      flex: 1; min-width: 0;
      border: none; outline: none; resize: none;
      padding: 22px 24px 96px;
      background: var(--surface);
      color: var(--on-surface);
      text-align: left; direction: ltr;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", monospace;
      font-size: 15px; line-height: 1.8;
      tab-size: 2;
    }
    #ed-preview-wrap {
      flex: 1; min-width: 0;
      overflow-y: auto;
      border-left: 1px solid var(--outline-variant);
      background: var(--surface);
    }
    #ed-preview { max-width: 760px; margin: 0 auto; padding: 24px 28px 120px; font-size: 15.5px; line-height: 1.7; color: var(--md-fg); word-wrap: break-word; text-align: left; }

    /* 预览排版（精简自 viewer-md） */
    #ed-preview h1, #ed-preview h2, #ed-preview h3, #ed-preview h4 { font-weight: 600; line-height: 1.3; margin: 1.5em 0 .55em; }
    #ed-preview h1 { font-size: 1.8em; padding-bottom: .3em; border-bottom: 1px solid var(--md-border); }
    #ed-preview h2 { font-size: 1.45em; padding-bottom: .3em; border-bottom: 1px solid var(--md-border); }
    #ed-preview h3 { font-size: 1.2em; }
    #ed-preview p { margin: .75em 0; }
    #ed-preview a { color: var(--md-link); text-decoration: none; }
    #ed-preview ul, #ed-preview ol { padding-left: 1.6em; margin: .6em 0; }
    #ed-preview code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; background: var(--md-code-bg); padding: .2em .4em; border-radius: 6px; }
    #ed-preview pre { margin: 1em 0; border-radius: 10px; overflow: auto; border: 1px solid var(--md-border); }
    #ed-preview pre code, #ed-preview pre.hljs { display: block; padding: 13px 15px; background: var(--md-code-bg); font-size: .86em; line-height: 1.5; border-radius: 10px; }
    #ed-preview pre code { padding: 0; background: transparent; border: none; }
    #ed-preview blockquote { margin: 1em 0; padding: .4em 1em; color: var(--md-muted); border-left: 4px solid var(--md-border); border-radius: 0 8px 8px 0; }
    #ed-preview table { border-collapse: collapse; margin: 1em 0; display: block; overflow: auto; }
    #ed-preview th, #ed-preview td { border: 1px solid var(--md-border); padding: 7px 13px; }
    #ed-preview th { background: var(--md-code-bg); font-weight: 600; }
    #ed-preview img { max-width: 100%; }
    #ed-preview hr { border: none; border-top: 1px solid var(--md-border); margin: 1.6em 0; }
    #ed-preview .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
    .ed-preview-empty { color: var(--md-muted); font-size: 13.5px; padding: 24px 0; }


    /* 符号面板：工具栏底下弹出来的一层，分组 + 搜索 + KaTeX 渲染的按钮 */
    .ed-syms {
      flex: none;
      border-bottom: 1px solid var(--outline-variant);
      background: var(--surface-container-lowest);
    }
    .sym-head {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sym-head::-webkit-scrollbar { height: 0; }
    .sym-tab {
      flex: none;
      padding: 5px 12px;
      border: none; border-radius: var(--radius-full);
      background: transparent; color: var(--on-surface-variant);
      font-size: 12.5px; font-family: inherit; white-space: nowrap; cursor: pointer;
      transition: background-color var(--transition), color var(--transition);
    }
    .sym-tab:hover { background: var(--surface-container-high); color: var(--on-surface); }
    .sym-tab.on { background: var(--primary); color: #fff; }
    [data-theme="dark"] .sym-tab.on { color: #1c1b1f; }
    .sym-search {
      flex: none; width: 168px; margin-left: auto;
      padding: 6px 12px;
      border: 1px solid var(--outline-variant); border-radius: var(--radius-full);
      background: var(--surface); color: var(--on-surface);
      font-size: 12.5px; font-family: inherit; outline: none;
    }
    .sym-search:focus { border-color: var(--primary); }
    .sym-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
      gap: 5px;
      padding: 9px 10px 11px;
      max-height: 184px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .sym-grid.wide { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    .sym-btn {
      min-height: 38px;
      display: flex; align-items: center; justify-content: center;
      padding: 4px 6px;
      border: 1px solid var(--outline-variant); border-radius: 9px;
      background: var(--surface); color: var(--on-surface);
      font-size: 14px; cursor: pointer;
      transition: border-color var(--transition), background-color var(--transition), transform 120ms ease;
    }
    .sym-btn:hover { border-color: var(--primary); background: var(--surface-container-high); }
    .sym-btn:active { transform: scale(.94); }
    .sym-btn .katex { font-size: 1em; }
    .sym-empty { grid-column: 1 / -1; padding: 14px 4px; font-size: 12.5px; color: var(--on-surface-variant); }

    /* 大纲：左侧一条，点标题跳过去 */
    .ed-outline {
      flex: none;
      width: 208px;
      border-right: 1px solid var(--outline-variant);
      background: var(--surface-container-lowest);
      overflow-y: auto;
      padding: 12px 6px 60px;
      scrollbar-width: thin;
    }
    .ed-main:not(.show-outline) .ed-outline { display: none; }
    .ol-item {
      display: block; width: 100%;
      padding: 6px 10px;
      border: none; border-radius: 8px;
      background: transparent; color: var(--on-surface-variant);
      font-size: 12.5px; font-family: inherit; text-align: left; line-height: 1.4;
      cursor: pointer;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ol-item:hover { background: var(--surface-container-high); color: var(--on-surface); }
    .ol-item.h1 { font-weight: 650; color: var(--on-surface); }
    .ol-item.h2 { padding-left: 18px; }
    .ol-item.h3 { padding-left: 30px; font-size: 12px; }
    .ol-item.h4 { padding-left: 42px; font-size: 12px; }
    .ol-empty { padding: 8px 10px; font-size: 12px; color: var(--on-surface-variant); }
    .ed-tool.on { background: var(--primary); color: #fff; }
    [data-theme="dark"] .ed-tool.on { color: #1c1b1f; }
    .ed-count { flex: none; font-size: 11.5px; color: var(--on-surface-variant); white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* ===== 窄屏（手机 / iPhone）=====
       两处结构性改动：
       ① 工具栏和符号面板用 order 挪到编辑区**下方**——手机打字时工具栏贴在键盘上沿才够得着，
          放顶上会被内容顶走，而且拇指要横穿整个屏幕。DOM 顺序不动，只翻 flex order。
       ② 高度改吃 --ed-vh（由 editor.js 从 visualViewport 写入）：iOS 弹出键盘时 dvh/vh 都不缩，
          只有 visualViewport.height 会缩，不跟着它算工具栏就被键盘盖住。配合 position:fixed
          防止 iOS 把整个布局视口往上顶。 */
    @media (max-width: 760px) {
      body.editor {
        position: fixed; inset: 0;
        height: var(--ed-vh, 100dvh);
      }
      .ed-bar { gap: 8px; padding: 9px 12px; flex-wrap: wrap; order: 1; }
      .ed-main { order: 2; }
      .ed-syms { order: 3; }
      .ed-toolbar { order: 4; }

      #ed-title { font-size: 16px; flex-basis: 0; }
      .ed-more { display: inline-flex; align-items: center; justify-content: center;
        flex: none; width: 32px; height: 32px;
        border: none; border-radius: var(--radius-full);
        background: transparent; color: var(--on-surface-variant);
        font-size: 17px; line-height: 1; cursor: pointer; }
      .ed-more[aria-expanded="true"] { background: var(--surface-container-high); color: var(--on-surface); }
      .seg.ed-view { display: inline-flex; }
      /* 学科 / 字数 / 状态换到第二行，默认收着，点 ⋯ 才出来 */
      #ed-subject, .ed-count, .ed-status { display: none; order: 10; }
      .ed-bar.expanded #ed-subject { display: block; flex: 1 1 100%; width: auto; }
      .ed-bar.expanded .ed-count, .ed-bar.expanded .ed-status { display: inline; }

      #ed-input { font-size: 16px; padding: 18px 18px 28px; }   /* 16px 防 iOS 聚焦缩放 */
      #ed-preview { padding: 20px 18px 40px; }
      .ed-main.show-preview #ed-input { display: none; }
      .ed-main:not(.show-preview) #ed-preview-wrap { display: none; }
      #ed-preview-wrap { border-left: none; }

      .ed-toolbar {
        padding: 5px 8px calc(5px + env(safe-area-inset-bottom));
        border-bottom: none;
        border-top: 1px solid var(--outline-variant);
        background: var(--surface-container-low);
      }
      .ed-tool { min-width: 42px; height: 40px; }   /* 触控更大 */
      .ed-tool-cfg { margin-left: 4px; padding-left: 10px; min-width: 34px; }
      .ed-syms { border-top: 1px solid var(--outline-variant); border-bottom: none; }
      .sym-search { width: 120px; }
      .sym-grid { max-height: 34vh; padding-bottom: 12px; }

      /* 手机上大纲改成盖在正文上的一层，不挤编辑区 */
      .ed-outline {
        position: absolute; left: 0; top: 0; bottom: 0; z-index: 5;
        width: 66vw; max-width: 260px;
        box-shadow: 6px 0 24px rgba(0, 0, 0, .18);
      }
      .ed-main { position: relative; }

      /* 自定义面板在手机上走底部抽屉 */
      .ed-cfg { align-items: flex-end; padding: 0; }
      .ed-cfg-sheet {
        width: 100%; max-height: 82vh;
        border-radius: 18px 18px 0 0;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .cfg-item { padding-top: 8px; padding-bottom: 8px; }
    }
  </style>
</head>
<body class="editor">
  <header class="ed-bar">
    <a class="ed-back" href="/" title="返回笔记库">←</a>
    <input id="ed-title" placeholder="笔记标题…" maxlength="80" autocomplete="off">
    <input id="ed-subject" placeholder="学科（可选）" maxlength="40" autocomplete="off">
    <span class="ed-count" id="ed-count"></span>
    <span class="ed-status" id="ed-status"></span>
    <!-- 窄屏专用：学科/字数/状态在顶栏里挤不下，收进这颗按钮展开的第二行 -->
    <button class="ed-more" id="ed-more-btn" type="button" title="更多" aria-label="更多" aria-expanded="false">⋯</button>
    <div class="seg seg-mini ed-view" id="ed-view" role="tablist" aria-label="视图">
      <button class="seg-btn active" type="button" data-view="edit">编辑</button>
      <button class="seg-btn" type="button" data-view="preview">预览</button>
    </div>
    <button class="create-btn" id="ed-save" type="button">保存</button>
  </header>

  <!-- Markdown 工具栏：点一下即插入/包裹语法，手机也好用。
       按钮不再写死在这里，改由 editor.js 的 TOOL_DEFS 渲染进 #ed-tools —— 顺序和显隐都能自定义。
       最右边的齿轮固定不参与滚动，否则工具排多了就找不着它。 -->
  <div class="ed-toolbar" id="ed-toolbar">
    <div class="ed-tools" id="ed-tools" role="toolbar" aria-label="Markdown 工具"></div>
    <button class="ed-tool ed-tool-cfg" type="button" id="ed-cfg-btn" title="自定义工具栏" aria-label="自定义工具栏">⚙</button>
  </div>

  <!-- 公式符号面板：分组 + 搜索，按钮本身由 KaTeX 渲染（数据见 editor-symbols.js） -->
  <div class="ed-syms" id="ed-syms" hidden>
    <div class="sym-head">
      <div class="sym-tabs" id="sym-tabs" style="display:flex;gap:2px"></div>
      <input class="sym-search" id="sym-search" type="search" placeholder="搜：希腊 / 求和 / 雷诺…" autocomplete="off">
    </div>
    <div class="sym-grid" id="sym-grid"></div>
  </div>

  <!-- 自定义工具栏：拖 ⠿ 排序、点开关显隐。手机上拖不准，另给 ↑↓ 两颗。 -->
  <div class="ed-cfg" id="ed-cfg" hidden>
    <div class="ed-cfg-sheet" role="dialog" aria-modal="true" aria-label="自定义工具栏">
      <header class="cfg-head">
        <h2>自定义工具栏</h2>
