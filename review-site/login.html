<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Xi Notebook</title>
  <script>
    (function(){try{var p=localStorage.getItem('nb-theme')||'auto';var d=p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
  </script>
  <link rel="icon" type="image/png" href="/assets/favicon-xi.png?v=20260613c">
  <link rel="stylesheet" href="/assets/style.css?v=20260818b">
  <!-- 登录页背景固定为极光，浓淡也固定，不读用户偏好 -->
  <script>document.documentElement.style.setProperty('--nb-bg-opacity','.85');</script>
</head>
<body class="login">
  <main class="login-card">
    <img class="login-logo" src="/assets/brand-xinotebook.png?v=20260613c" alt="Xi Notebook">
    <span class="eyebrow">Welcome back</span>
    <form id="login-form">
      <label for="password">Access password</label>
      <input type="password" id="password" autocomplete="current-password" required autofocus>
      <button type="submit" id="submit-btn">Enter →</button>
      <p id="error" class="error-msg" hidden>Wrong password</p>
    </form>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const err = document.getElementById('error');
    const btn = document.getElementById('submit-btn');

    // 深链被拦下来时中间件会带上 ?next=，登录完回到原来那一页（比如 /dav/ 挂载地址）。
    // 只认站内相对路径：第二个字符是 / 或 \ 都要挡 —— '//外站' 是协议相对地址，
    // 而 '/\外站' 会被浏览器规范化成同一个东西，两者都能把人送出站（开放重定向）。
    function nextPath() {
      try {
        const n = new URLSearchParams(location.search).get('next');
        if (n && n[0] === '/' && n[1] !== '/' && n[1] !== '\\') return n;
      } catch {}
      return '/';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Checking…';

      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (res.ok) {
          // 密码可能对应另一位用户；先清掉上一个会话的首屏缓存，再由服务端偏好恢复。
          localStorage.removeItem('nb-theme');
          localStorage.removeItem('nb-background');
          location.href = nextPath();
          return;
        }
        err.textContent = 'Wrong password';
        err.hidden = false;
      } catch {
        err.textContent = 'Network error, please retry';
        err.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enter →';
      }
    });
  </script>
  <script src="/assets/backgrounds.js?v=20260818b" defer></script>
</body>
</html>
