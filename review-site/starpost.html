<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f6fb">
  <title>星邮 · 私人社交聊天</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f8f6fb;color:#26222b;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .coursebar{position:fixed;z-index:5;inset:0 0 auto;height:calc(50px + env(safe-area-inset-top));display:flex;align-items:center;gap:11px;padding:env(safe-area-inset-top) 12px 0;border-bottom:1px solid rgba(67,55,78,.12);background:rgba(250,248,252,.9);backdrop-filter:blur(20px) saturate(1.4)}
    .back,.open{height:34px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;border:1px solid rgba(67,55,78,.14);border-radius:11px;background:#fff;color:#5f5866;text-decoration:none;white-space:nowrap}.back{width:36px;padding:0;font-size:19px}.back:hover,.open:hover{border-color:#8b78b7;color:#5d4995}
    .identity{min-width:0;display:flex;flex:1;align-items:center;gap:10px}.mark{width:31px;height:31px;display:grid;place-items:center;flex:none;border-radius:10px;background:linear-gradient(145deg,#6d5aa7,#438e85);color:#fff;box-shadow:0 6px 16px rgba(83,69,130,.22)}.mark svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.copy{min-width:0}.copy strong,.copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.copy strong{font-size:14px}.copy span{margin-top:1px;color:#918a96;font-size:10px}.status{display:flex;align-items:center;gap:6px;color:#77717d;font-size:10px}.status i{width:7px;height:7px;border-radius:50%;background:#d4a847;box-shadow:0 0 0 3px rgba(212,168,71,.12)}.status.ready i{background:#54a27f;box-shadow:0 0 0 3px rgba(84,162,127,.12)}
    .fallback{position:fixed;inset:50px 0 0;display:grid;place-items:center;padding:24px;color:#85808a;text-align:center}.fallback div{max-width:430px}.fallback strong{display:block;margin-bottom:7px;color:#332f37;font-size:17px}
    iframe{position:fixed;z-index:2;inset:calc(50px + env(safe-area-inset-top)) 0 0;width:100%;height:calc(100% - 50px - env(safe-area-inset-top));border:0;background:#f8f6fb}
    @media(prefers-color-scheme:dark){html,body{background:#121015;color:#eeeaf1}.coursebar{border-color:rgba(235,225,244,.11);background:rgba(26,23,30,.9)}.back,.open{border-color:#39333e;background:#242028;color:#bbb3c0}.fallback strong{color:#f0ecf2}iframe{background:#121015}}
    @media(max-width:620px){.coursebar{height:calc(46px + env(safe-area-inset-top));padding-right:8px;padding-left:8px}.mark{width:29px;height:29px}.copy span,.status{display:none}.open{width:36px;padding:0;font-size:0}.open::before{content:"↗";font-size:17px}iframe{top:calc(46px + env(safe-area-inset-top));height:calc(100% - 46px - env(safe-area-inset-top))}}
  </style>
</head>
<body>
  <header class="coursebar">
    <a class="back" href="/index.html" aria-label="返回课程">←</a>
    <div class="identity">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5.5 8.5 16 3l10.5 5.5v15L16 29 5.5 23.5Z"/><path d="m6 9 10 8 10-8M16 17v12"/></svg></span>
      <div class="copy"><strong>星邮 · 私人社交聊天</strong><span>好友、私聊、群组与跨设备消息历史</span></div>
    </div>
    <span class="status" id="status"><i></i><span>正在连接</span></span>
    <a class="open" href="/starpost-app/" target="_blank" rel="noopener">独立打开 ↗</a>
  </header>
  <div class="fallback"><div><strong>正在打开星邮</strong><span>正在通过 Notebook 安全入口连接聊天服务。若当前浏览器限制嵌入内容，请使用右上角“独立打开”。</span></div></div>
  <iframe id="chat-frame" src="/starpost-app/" title="星邮私人社交聊天" loading="eager" allow="microphone; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const frame=document.getElementById('chat-frame'),status=document.getElementById('status');
    frame.addEventListener('load',()=>{status.classList.add('ready');status.querySelector('span').textContent='已连接'},{once:true});
    setTimeout(()=>{if(!status.classList.contains('ready'))status.querySelector('span').textContent='连接较慢'},8000);
  </script>
</body>
</html>
