<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17141b">
  <meta name="color-scheme" content="dark light">
  <title>星邮管理台</title>
  <link rel="stylesheet" href="./admin.css?v=20260730b">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 32 32"><path d="M5.5 8.5 16 3l10.5 5.5v15L16 29 5.5 23.5Z"/><path d="m6 9 10 8 10-8M16 17v12"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 18.5 3.5 21l4.2-1.3a9 9 0 1 0-2.7-1.2Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="5"/><path d="m12 11 9-9M18 5l3 3M15 8l3 3"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <div class="admin-shell">
    <aside class="admin-nav">
      <a class="admin-brand" href="./"><svg><use href="#i-logo"/></svg><div><strong>星邮</strong><span>Administration</span></div></a>
      <nav>
        <button class="active" data-admin-view="overview" aria-label="运行总览"><svg><use href="#i-activity"/></svg><span>总览</span></button>
        <button data-admin-view="users" aria-label="用户管理"><svg><use href="#i-users"/></svg><span>用户</span></button>
        <button data-admin-view="conversations" aria-label="会话审查"><svg><use href="#i-chat"/></svg><span>会话审查</span></button>
        <button data-admin-view="invites" aria-label="邀请码管理"><svg><use href="#i-key"/></svg><span>邀请码</span></button>
      </nav>
      <a class="return-chat" href="./"><svg><use href="#i-back"/></svg><span>返回聊天</span></a>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <div><p id="admin-eyebrow">Operations</p><h1 id="admin-title">运行总览</h1></div>
        <span class="admin-badge" id="admin-identity">管理员</span>
      </header>
      <section id="admin-content" class="admin-content"></section>
    </main>
  </div>

  <dialog id="message-dialog">
    <div class="dialog-head"><div><p>Conversation review</p><h2 id="message-dialog-title">消息记录</h2></div><button id="message-dialog-close" aria-label="关闭消息审查"><svg><use href="#i-close"/></svg></button></div>
    <div id="message-dialog-list" class="review-messages"></div>
  </dialog>
  <div id="admin-toast" class="admin-toast" hidden></div>
  <script type="module" src="./admin.js?v=20260730b"></script>
</body>
</html>
